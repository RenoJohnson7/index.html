name: Build Website APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clone and Build
        run: |
          git clone https://github.com/Jipok/website-to-apk.git build_folder
          cd build_folder
          chmod +x gradlew
          # This line creates the configuration for your specific website
          echo '{"url": "https://renojohnson7.github.io/index.html", "name": "RenoApp"}' > app/src/main/assets/config.json
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RenoApp-Download
          path: build_folder/app/build/outputs/apk/debug/*.apk
