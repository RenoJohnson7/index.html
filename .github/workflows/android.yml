name: Build Final App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          git clone https://github.com/Jipok/website-to-apk.git wrapper
          cd wrapper

          # This line forces your URL and Name into the app's settings
          echo '{"url": "https://renojohnson7.github.io/index.html", "name": "Kingdom of Powers"}' > app/src/main/assets/config.json

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kingdom-Of-Powers-App
          path: wrapper/app/build/outputs/apk/debug/*.apk
